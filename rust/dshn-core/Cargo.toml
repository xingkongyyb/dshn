[package]
name = "dshn-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance Rust native engine for DSHN (archive extractor, fast SSE chat, virtual frame encoder)"

[lib]
name = "dshn_core"
crate-type = ["cdylib"]

[features]
default = ["fast-chat"]
fast-chat = ["dep:ureq"]

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
jni = "0.21"
jpeg-encoder = "0.6"
libc = "0.2"
ruzstd = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"], optional = true }
