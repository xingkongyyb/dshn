name: Android CI

on:
  push:
    branches: [ main, feat/rust-perf-engine ]
  pull_request:
    branches: [ main, feat/rust-perf-engine ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22 for JS syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify DSHN bridge & helper JS syntax
        run: |
          node --check app/src/main/assets/dshn/dshn-dns-preload.cjs
          node --check app/src/main/assets/dshn/dshn-mcp-relay.mjs
          node --check app/src/main/assets/dshn/dshn-pty-runner.mjs
          node --check app/src/main/assets/dshn/dshn-session-bridge.mjs

      - name: Run Rust unit tests & relay compile check
        run: |
          cargo test --manifest-path rust/Cargo.toml -p dshn-core --lib --no-default-features
          cargo check --manifest-path rust/Cargo.toml -p dshn-mcp-relay

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n1)"
          awk 'BEGIN{for(i=0;i<50;i++)print "y"}' | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run JVM unit tests, debug APK & R8 stagingRelease verification
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest :app:assembleDebug :app:assembleStagingRelease -PdshnSkipBundledEnv=true
